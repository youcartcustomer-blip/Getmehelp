  <div class="spinner"></div>

<script>
const SUPABASE_URL = "https://kcqdqgypsnpdtvmatuua.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjcWRxZ3lwc25wZHR2bWF0dXVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNTU5ODMsImV4cCI6MjA5ODgzMTk4M30.8UqayIF_29Qk-Q9VT2JRipy-LweYXLCgO7v2D2KhZJY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATEGORY_MAP = {
  roofing: "Home Services", hvac: "Home Services", plumbing: "Home Services",
  solar: "Home Services", remodeling: "Home Services", "water-damage": "Home Services",
  windows: "Home Services", siding: "Home Services", "pest-control": "Home Services",
  "credit-cards": "Finance", loans: "Finance", banking: "Finance", investing: "Finance",
  insurance: "Insurance", "auto-insurance": "Insurance", "life-insurance": "Insurance",
  flights: "Travel", hotels: "Travel", "car-rental": "Travel", "travel-insurance": "Travel",
  supplements: "Health & Wellness", fitness: "Health & Wellness", skincare: "Health & Wellness",
  vpn: "Tech & Gadgets", hosting: "Tech & Gadgets", software: "Tech & Gadgets", electronics: "Tech & Gadgets",
  apparel: "Fashion & Retail", beauty: "Fashion & Retail", accessories: "Fashion & Retail",
  streaming: "Entertainment", sports: "Entertainment", gaming: "Entertainment"
};
function getCategory(niche){ return CATEGORY_MAP[(niche || "").toLowerCase()] || "Other"; }

async function go(){
  const params = new URLSearchParams(window.location.search);
  const niche = params.get('niche');
  const cid = params.get('cid');

  if(!niche && !cid){
    document.getElementById('msg').innerHTML = 'Missing offer reference. <a href="index.html">Browse all offers →</a>';
    return;
  }

  let query = sb.from('campaigns').select('*').eq('active', true);
  query = cid ? query.eq('id', cid) : query.eq('niche', niche);
  const { data, error } = await query.order('created_at', { ascending: false }).limit(1);

  const campaign = data && data[0];
  if(error || !campaign){
    document.getElementById('msg').innerHTML = 'That offer isn\'t live right now. <a href="index.html">Browse all offers →</a>';
    return;
  }

  // log the click (best-effort, doesn't block redirect)
  function getVisitorId(){
    let id = localStorage.getItem('gmh_vid');
    if(!id){ id = crypto.randomUUID(); localStorage.setItem('gmh_vid', id); }
    return id;
  }
  sb.from('campaign_clicks').insert({
    campaign_id: campaign.id,
    niche: campaign.niche,
    category: getCategory(campaign.niche),
    utm_source: params.get('utm_source') || 'direct',
    utm_campaign: params.get('utm_campaign') || null,
    visitor_id: getVisitorId()
  }).then(() => {});

  if(typeof fbq !== 'undefined') fbq('track', 'Lead', { content_name: campaign.niche });
  if(typeof gtag !== 'undefined') gtag('event', 'conversion', { send_to: 'AW-XXXXXXXXX/XXXXXXXXXXXX' });

  const clickref = [campaign.clickref_base || campaign.niche, params.get('utm_source') || 'direct', params.get('utm_campaign') || ''].filter(Boolean).join('_');
  let destination = campaign.awin_link;
  try{
    const url = new URL(campaign.awin_link);
    url.searchParams.set('clickref', clickref);
    destination = url.toString();
  }catch(e){}

  window.location.replace(destination);
}

go();
</script>
