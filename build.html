<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campaign Builder — GetMeHelp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#ffffff;
    --paper:#201a15;
    --red:#f2600c;
    --teal:#c94a05;
    --muted:#8a7f74;
    --line: rgba(32,26,21,0.1);
    --surface:#fff4ea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  header{ padding: 26px 20px 6px; text-align:center; }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--teal); font-weight:700;
  }
  h1{
    font-family:'Anton',sans-serif; font-weight:400;
    font-size:clamp(28px,8vw,40px); margin:6px 0 4px;
  }
  main{ max-width:520px; margin:0 auto; padding: 10px 20px; }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
    margin-bottom:22px;
  }
  label{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
    margin: 16px 0 6px;
  }
  label:first-of-type{ margin-top:0; }
  input[type=text], input[type=url], select{
    width:100%;
    background:#ffffff;
    border:1px solid var(--line);
    color:var(--paper);
    padding:12px 14px;
    border-radius:6px;
    font-size:15px;
    font-family:'Inter',sans-serif;
  }
  input:focus, select:focus{ outline:2px solid var(--teal); }
  .file-drop{
    border:1.5px dashed var(--line);
    border-radius:8px;
    padding:18px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    cursor:pointer;
    position:relative;
  }
  .file-drop input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  #preview{
    margin-top:12px;
    width:100%;
    max-height:220px;
    object-fit:cover;
    border-radius:6px;
    display:none;
  }
  .crop-preview-row{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .crop-box{ flex:1; text-align:center; }
  .crop-box span{
    display:block;
    font-size:10px;
    color:var(--muted);
    margin-top:5px;
    font-family:'JetBrains Mono',monospace;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .crop-img{
    width:100%;
    border-radius:8px;
    background-size:cover;
    background-position:center;
    border:1px solid var(--line);
    background-color:#eee;
  }
  .hero-crop{ aspect-ratio: 4/5; }
  .grid-crop{ aspect-ratio: 4/3; }
  button{
    width:100%;
    margin-top:22px;
    background:var(--red);
    color:#fff;
    border:none;
    font-weight:700;
    font-size:15px;
    padding:15px;
    border-radius:30px;
    cursor:pointer;
  }
  button:disabled{ opacity:0.5; }
  .status{
    margin-top:14px;
    font-size:13px;
    text-align:center;
    color:var(--muted);
    min-height:18px;
  }
  .status.ok{ color:var(--teal); }
  .status.err{ color:var(--red); }

  .list-title{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; text-transform:uppercase; letter-spacing:.1em;
    color:var(--muted); margin: 30px 0 12px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .row img{
    width:44px;height:44px;border-radius:5px;object-fit:cover;
    background:#e8dccb; flex-shrink:0;
  }
  .row .info{ flex:1; min-width:0; }
  .row .niche{ font-size:13px; font-weight:600; }
  .row .headline{ font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row button{
    width:auto; margin:0; padding:6px 12px; font-size:11px;
    border-radius:16px;
  }
  .row .toggle{ background:var(--red); color:#fff; }
  .row .toggle.inactive{ background:transparent; border:1px solid var(--line); color:var(--muted); }
  .row .del{ background:transparent; border:1px solid var(--red); color:var(--red); }
  .row .reorder{ background:transparent; border:1px solid var(--line); color:var(--paper); padding:6px 9px; }
  .row .reorder:disabled{ opacity:0.25; }
  a.back{ color:var(--teal); font-size:13px; text-decoration:none; font-family:'JetBrains Mono',monospace; }
  .sub-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:8px;
    font-size:13px;
  }
  .sub-row .sub-date{ color:var(--muted); font-size:11px; }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Builder</div>
  <h1>New campaign</h1>
</header>

<main>
  <div class="card" id="loginCard">
    <label>Email</label>
    <input type="text" id="loginEmail" placeholder="you@example.com" />
    <button id="sendLinkBtn">Send sign-in link</button>
    <div class="status" id="loginStatus"></div>
  </div>

  <div id="appArea" style="display:none;">
    <div class="card">
      <label>Niche (lowercase, dashes only — e.g. roofing, credit-cards, dazn-sports)</label>
      <input type="text" id="niche" placeholder="roofing" />

      <label>Headline (shown on poster)</label>
      <input type="text" id="headline" placeholder="Compare Top Roofing Companies" />

      <label>Awin tracking link</label>
      <input type="url" id="awinLink" placeholder="https://www.awin1.com/cread.php?..." />

      <label>Clickref tag (optional — defaults to niche)</label>
      <input type="text" id="clickref" placeholder="roofing_launch" />

      <label>Offer highlight (e.g. 30% OFF, Free Estimate, 0% APR)</label>
      <input type="text" id="discountLabel" placeholder="30% OFF" />

      <label>Expires on (optional — offer auto-hides after this date)</label>
      <input type="text" id="expiresAt" placeholder="YYYY-MM-DD" />

      <label>Show as</label>
      <select id="placement">
        <option value="both">Big slide + small offer row (default)</option>
        <option value="hero">Big slide only</option>
        <option value="grid">Small offer row only</option>
      </select>

      <label>Poster image</label>
      <p style="font-size:12px;color:var(--muted);margin:-4px 0 10px;">Best results: a landscape photo, at least 1200×900px, with the main subject centered — it gets cropped differently for the big slide vs. the small card below.</p>
      <div class="file-drop" id="dropZone">
        Tap to upload poster image
        <input type="file" id="fileInput" accept="image/*" />
      </div>
      <img id="preview" />
      <div class="crop-preview-row" id="cropPreviewRow" style="display:none;">
        <div class="crop-box">
          <div class="crop-img hero-crop" id="heroCropImg"></div>
          <span>Big slide crop</span>
        </div>
        <div class="crop-box">
          <div class="crop-img grid-crop" id="gridCropImg"></div>
          <span>Small row crop</span>
        </div>
      </div>

      <button id="submitBtn">Save campaign</button>
      <div class="status" id="status"></div>
    </div>

    <div class="list-title">Live campaigns</div>
    <div id="list"></div>

    <div class="list-title" style="display:flex;align-items:center;justify-content:space-between;">
      <span>Subscribers (<span id="subCount">0</span>)</span>
      <button id="exportSubsBtn" style="width:auto;margin:0;padding:6px 14px;font-size:11px;border-radius:16px;">Export CSV</button>
    </div>
    <div id="subscriberList"></div>

    <p style="text-align:center;margin-top:8px;"><button id="signOutBtn" style="width:auto;background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 16px;font-size:12px;">Sign out</button></p>
  </div>

  <p style="text-align:center;margin-top:20px;"><a class="back" href="index.html">← view offer board</a></p>
</main>

<script>
const SUPABASE_URL = "https://kcqdqgypsnpdtvmatuua.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjcWRxZ3lwc25wZHR2bWF0dXVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNTU5ODMsImV4cCI6MjA5ODgzMTk4M30.8UqayIF_29Qk-Q9VT2JRipy-LweYXLCgO7v2D2KhZJY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- AUTH ---------- */
function setLoginStatus(msg, type){
  const el = document.getElementById('loginStatus');
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}

const ADMIN_EMAIL = 'hasibkhan2266@gmail.com';

async function checkSession(){
  const { data: { session } } = await sb.auth.getSession();
  if(session && session.user?.email === ADMIN_EMAIL){
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('appArea').style.display = 'block';
    loadList();
    loadSubscribers();
  }else if(session){
    // signed in, but not the admin account — sign them out and don't expose the builder
    await sb.auth.signOut();
    document.getElementById('loginCard').style.display = 'block';
    document.getElementById('appArea').style.display = 'none';
    setLoginStatus('This account is not authorized to use this page.', 'err');
  }else{
    document.getElementById('loginCard').style.display = 'block';
    document.getElementById('appArea').style.display = 'none';
  }
}

document.getElementById('sendLinkBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  if(!email){
    setLoginStatus('Enter your email first.', 'err');
    return;
  }
  setLoginStatus('Sending link…');
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.href.split('#')[0].split('?')[0] }
  });
  if(error){ setLoginStatus(error.message, 'err'); return; }
  setLoginStatus('Check your email — tap the link to sign in. (Also check spam.)', 'ok');
});

document.getElementById('signOutBtn')?.addEventListener('click', async () => {
  await sb.auth.signOut();
  checkSession();
});

checkSession();

/* ---------- BUILDER ---------- */
let selectedFile = null;
let compressedBlob = null;

function compressImage(file, maxDim = 1600, quality = 0.82){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          if(blob) resolve(blob); else reject(new Error('Compression failed'));
        }, 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  selectedFile = file;
  compressedBlob = null;

  const reader = new FileReader();
  reader.onload = (ev) => {
    preview.src = ev.target.result;
    preview.style.display = 'block';
    document.getElementById('heroCropImg').style.backgroundImage = `url(${ev.target.result})`;
    document.getElementById('gridCropImg').style.backgroundImage = `url(${ev.target.result})`;
    document.getElementById('cropPreviewRow').style.display = 'flex';
  };
  reader.readAsDataURL(file);

  setStatus(`Compressing… (original ${(file.size / 1024).toFixed(0)}KB)`);
  try{
    compressedBlob = await compressImage(file);
    setStatus(`Ready — ${(file.size / 1024).toFixed(0)}KB → ${(compressedBlob.size / 1024).toFixed(0)}KB`, 'ok');
  }catch(err){
    setStatus('Compression failed, will upload original.', 'err');
    compressedBlob = null;
  }
});

function setStatus(msg, type){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  const niche = document.getElementById('niche').value.trim().toLowerCase().replace(/\s+/g, '-');
  const headline = document.getElementById('headline').value.trim();
  const awinLink = document.getElementById('awinLink').value.trim();
  const clickref = document.getElementById('clickref').value.trim();
  const discountLabel = document.getElementById('discountLabel').value.trim();
  const expiresAtRaw = document.getElementById('expiresAt').value.trim();
  const placement = document.getElementById('placement').value;

  if(!niche || !awinLink){
    setStatus('Niche and Awin link are required.', 'err');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  setStatus('Saving…');

  let posterUrl = null;

  try{
    if(selectedFile){
      const path = `${niche}-${Date.now()}.jpg`;
      const fileToUpload = compressedBlob || selectedFile;
      const { error: uploadError } = await sb.storage.from('posters').upload(path, fileToUpload, { contentType: 'image/jpeg' });
      if(uploadError) throw uploadError;
      const { data: pub } = sb.storage.from('posters').getPublicUrl(path);
      posterUrl = pub.publicUrl;
    }

    const { error: insertError } = await sb.from('campaigns').insert({
      niche,
      headline,
      awin_link: awinLink,
      clickref_base: clickref || niche,
      discount_label: discountLabel || null,
      expires_at: expiresAtRaw || null,
      placement: placement || 'both',
      poster_url: posterUrl,
      active: true
    });
    if(insertError) throw insertError;

    setStatus('Campaign saved ✓', 'ok');
    document.getElementById('niche').value = '';
    document.getElementById('headline').value = '';
    document.getElementById('awinLink').value = '';
    document.getElementById('clickref').value = '';
    document.getElementById('discountLabel').value = '';
    document.getElementById('expiresAt').value = '';
    document.getElementById('placement').value = 'both';
    preview.style.display = 'none';
    document.getElementById('cropPreviewRow').style.display = 'none';
    selectedFile = null;
    compressedBlob = null;
    fileInput.value = '';
    loadList();
  }catch(err){
    setStatus('Error: ' + err.message, 'err');
  }finally{
    btn.disabled = false;
  }
});

async function loadList(){
  const list = document.getElementById('list');
  const { data, error } = await sb
    .from('campaigns')
    .select('*')
    .order('sort_order', { ascending: true })
    .order('created_at', { ascending: false });

  if(error){
    list.innerHTML = `<div style="color:var(--muted);font-size:13px;">Couldn't load: ${error.message}</div>`;
    return;
  }
  if(!data || data.length === 0){
    list.innerHTML = `<div style="color:var(--muted);font-size:13px;">No campaigns yet.</div>`;
    return;
  }

  list.innerHTML = '';
  data.forEach((c, idx) => {
    const row = document.createElement('div');
    row.className = 'row';
    const expiryTag = c.expires_at ? `<div class="headline">Expires ${new Date(c.expires_at).toLocaleDateString()}</div>` : '';
    const placementLabel = { hero: 'Big slide only', grid: 'Small row only', both: 'Slide + row' }[c.placement || 'both'];
    row.innerHTML = `
      <img src="${c.poster_url || ''}" onerror="this.style.opacity=0" />
      <div class="info">
        <div class="niche">${c.niche}</div>
        <div class="headline">${c.headline || ''}</div>
        <div class="headline">${placementLabel}</div>
        ${expiryTag}
      </div>
      <button class="reorder" data-id="${c.id}" data-dir="up" ${idx === 0 ? 'disabled' : ''}>↑</button>
      <button class="reorder" data-id="${c.id}" data-dir="down" ${idx === data.length - 1 ? 'disabled' : ''}>↓</button>
      <button class="reorder copylink" data-niche="${c.niche}">🔗</button>
      <button class="toggle ${c.active ? '' : 'inactive'}" data-id="${c.id}" data-active="${c.active}">${c.active ? 'Live' : 'Off'}</button>
      <button class="del" data-id="${c.id}">Del</button>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll('.copylink').forEach(btn => {
    btn.addEventListener('click', () => {
      const link = `${window.location.origin}${window.location.pathname.replace('build.html','')}go.html?niche=${encodeURIComponent(btn.dataset.niche)}`;
      navigator.clipboard.writeText(link).then(() => {
        const original = btn.textContent;
        btn.textContent = '✓';
        setTimeout(() => { btn.textContent = original; }, 1200);
      });
    });
  });

  list.querySelectorAll('.reorder').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const dir = btn.dataset.dir;
      const idx = data.findIndex(c => c.id === id);
      const swapIdx = dir === 'up' ? idx - 1 : idx + 1;
      if(swapIdx < 0 || swapIdx >= data.length) return;
      const a = data[idx], b = data[swapIdx];
      const aOrder = a.sort_order ?? idx;
      const bOrder = b.sort_order ?? swapIdx;
      await sb.from('campaigns').update({ sort_order: bOrder }).eq('id', a.id);
      await sb.from('campaigns').update({ sort_order: aOrder }).eq('id', b.id);
      loadList();
    });
  });

  list.querySelectorAll('.toggle').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const isActive = btn.dataset.active === 'true';
      await sb.from('campaigns').update({ active: !isActive }).eq('id', id);
      loadList();
    });
  });
  list.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Delete this campaign?')) return;
      const id = btn.dataset.id;
      await sb.from('campaigns').delete().eq('id', id);
      loadList();
    });
  });
}

async function loadSubscribers(){
  const list = document.getElementById('subscriberList');
  const countEl = document.getElementById('subCount');
  const { data, error } = await sb
    .from('subscribers')
    .select('*')
    .order('created_at', { ascending: false });

  if(error){
    list.innerHTML = `<div style="color:var(--muted);font-size:13px;">Couldn't load: ${error.message}</div>`;
    return;
  }

  countEl.textContent = data.length;

  if(data.length === 0){
    list.innerHTML = `<div style="color:var(--muted);font-size:13px;">No subscribers yet.</div>`;
    return;
  }

  list.innerHTML = data.map(s => `
    <div class="sub-row">
      <span>${s.email}</span>
      <span class="sub-date">${new Date(s.created_at).toLocaleDateString()}</span>
    </div>
  `).join('');

  window.__subscribersCache = data;
}

document.getElementById('exportSubsBtn').addEventListener('click', () => {
  const data = window.__subscribersCache || [];
  if(data.length === 0) return;
  const csv = 'email,signed_up\n' + data.map(s => `${s.email},${s.created_at}`).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'getmehelp-subscribers.csv';
  a.click();
  URL.revokeObjectURL(url);
});

loadList();
</script>
</body>
</html>
